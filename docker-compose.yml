services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: contentsync
      POSTGRES_PASSWORD: contentsync
      POSTGRES_DB: contentsync
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction"] # requis par BullMQ
    ports: ["6379:6379"]

volumes:
  pgdata:
